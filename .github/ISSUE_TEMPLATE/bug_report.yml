name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Fill in what you can.
  - type: input
    id: version
    attributes:
      label: depvibe version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v20.11.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command you ran + package you checked.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual output
    validations:
      required: true
